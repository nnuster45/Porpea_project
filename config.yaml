# ตั้งค่า pipeline หาทำเลตลาด
# API key ไม่ได้อยู่ในไฟล์นี้ — ใส่ใน .env (ดู .env.example)

area:
  name: ชลบุรี
  # คำที่ต้องมีใน formattedAddress ถึงจะนับว่าอยู่ในพื้นที่ (กันผลล้นไปจังหวัดอื่น)
  address_must_contain: ["ชลบุรี", "Chon Buri", "Chonburi"]
  # กรอบสี่เหลี่ยมครอบจังหวัด (lat ใต้→เหนือ, lng ตะวันตก→ตะวันออก)
  bbox:
    south: 12.55
    north: 13.62
    west: 100.78
    east: 101.62
  # ขนาดช่อง grid ตั้งต้น (องศา, 0.1 ≈ 11 กม.) ถ้าช่องไหนผลเต็ม 60 จะซอยย่อยอัตโนมัติ
  tile_deg: 0.1
  max_subdivide_depth: 2

discover:
  # คำค้นหาตลาด — เพิ่ม/ลดได้ ยิ่งเยอะยิ่งครอบคลุมแต่ใช้ quota มากขึ้น
  keywords:
    - ตลาดนัด
    - ตลาด
    - ตลาดโต้รุ่ง
    - ตลาดเย็น
    - ตลาดเช้า
    - walking street
    - ถนนคนเดิน
    - night market
  # ตัดผลที่ชื่อไม่ใช่ตลาดจริง (เช่น "ตลาดหุ้น", ร้านในตลาด) — regex, ไม่สนตัวพิมพ์
  name_must_match: "ตลาด|market|walking street|ถนนคนเดิน|บาซาร์|bazaar|plaza|พลาซ่า"
  name_exclude: "ตลาดหลักทรัพย์|ประกันภัย|อสังหา|ธนาคาร"
  # คัดว่าอะไรคือ "ตัวตลาด" (keep=1) — ที่เหลือ keep=0 (แค่แนะนำ แก้ได้ใน review/keep.csv)
  # จากผลจริงในชลบุรี: ร้านที่ตั้งชื่อตามตลาด ("7-11 สาขาตลาด…", "CJ สาขาตลาด…") ปนมาเยอะมาก
  # 1) ชื่อมีคำเหล่านี้ → keep=0 (ร้านสาขา / ที่อยู่อาศัย)
  suspect_name: "สาขา|branch|^ร้าน|^บริษัท|^หจก|คอนโด|condo|หมู่บ้าน|อพาร์ท|apartment"
  # 2) ประเภทของ Google ที่เป็นตลาด → keep=1
  market_types: [market, flea_market, farmers_market, food_court]
  # 3) ประเภทอื่น แต่ชื่อขึ้นต้นแบบตลาด → keep=1 (Google จัดประเภทตลาดไทยผิดบ่อย)
  market_name_prefix: "^(?:ตลาด|ถนนคนเดิน|walking street|night market|ไนท์มาร์เก็ต|ไนท์ บาซาร์)"

surroundings:
  # source: google_aggregate (Places Aggregate API) หรือ osm (Overpass, ฟรี)
  source: google_aggregate
  radii_m: [500, 1500]
  # ชื่อ feature -> place types ของ Google (นับรวมกัน)
  # https://developers.google.com/maps/documentation/places/web-service/place-types
  # เขียนเป็น list (ใช้ radii_m ด้านบน) หรือ {types: [...], radii_m: [...]} เพื่อกำหนดรัศมีเฉพาะตัว
  # school/hospital/transit/โรงงาน ดึงจาก OSM (ฟรี) ด้านล่างแทน
  # ดึงเฉพาะรัศมีที่ใช้ใน scoring.pillars (call ละ $0 ใน free cap แต่จำกัด 5,000/เดือน)
  # → 7 call ต่อตลาด ≈ ฟรีถึง ~700 ตลาด
  google_types:
    conv_store: {types: [convenience_store], radii_m: [500]}
    supermarket: {types: [supermarket, grocery_store], radii_m: [1500]}
    mall: {types: [shopping_mall, department_store], radii_m: [1500]}
    university: {types: [university], radii_m: [1500]}
    apartment: {types: [apartment_building, apartment_complex], radii_m: [1500]}
    lodging: {types: [lodging], radii_m: [1500]}
    # ที่ทำงาน (ออฟฟิศ + หน่วยราชการ) — 500 ม. = ระยะเดินช่วงพักเที่ยง
    workplace:
      types: [corporate_office, city_hall, local_government_office, courthouse]
      radii_m: [500]
  # ชื่อ feature -> Overpass filter (ใช้เมื่อ source: osm หรือ features เสริมด้านล่าง)
  osm_filters:
    conv_store: ['nwr["shop"="convenience"]']
    supermarket: ['nwr["shop"="supermarket"]']
    mall: ['nwr["shop"="mall"]', 'nwr["shop"="department_store"]']
    university: ['nwr["amenity"="university"]', 'nwr["amenity"="college"]']
    school: ['nwr["amenity"="school"]']
    hospital: ['nwr["amenity"="hospital"]']
    lodging: ['nwr["tourism"="hotel"]', 'nwr["tourism"="guest_house"]']
    apartment: ['nwr["building"="dormitory"]', 'nwr["building"="apartments"]']
    transit: ['nwr["highway"="bus_stop"]']
  # นับจำนวนจาก OSM เพิ่มเสมอ (ฟรี) — ตัวที่ไม่ได้ให้ Google นับ; ตั้ง {} ถ้าไม่ต้องการ
  osm_extra:
    school: ['nwr["amenity"="school"]']
    hospital: ['nwr["amenity"="hospital"]']
    transit: ['nwr["highway"="bus_stop"]']
  # ขนาดพื้นที่ (เฮกตาร์) ในรัศมี จาก OSM (ฟรี) → feature ชื่อ <ชื่อ>_ha_<รัศมี> เช่น industrial_ha_1500
  # วัดเป็นพื้นที่ ไม่ใช่จำนวน — โรงงานใหญ่จึงมีน้ำหนักมากกว่าโรงงานเล็ก
  osm_area:
    industrial: ['way["landuse"="industrial"]', 'relation["landuse"="industrial"]']

# ไฟล์ POI ภายนอก — CSV ต้องมีคอลัมน์ lat, lng (ไฟล์ไม่มี = ข้ามไปเฉย ๆ)
# - category (ถ้ามี) แยก feature ตามค่านั้น เช่น seven_ปั๊ม_500
# - weight: ชื่อคอลัมน์ตัวเลข → รวมค่าคอลัมน์นั้นในรัศมีแทนการนับจำนวนจุด
external_pois:
  - name: seven                       # → seven_500, seven_1500
    path: data/external/7eleven.csv
    radii_m: [500, 1500]
  - name: estate_workers              # → estate_workers_3000 = จำนวนคนงานรวมของนิคมฯ ในรัศมี 3 กม.
    path: data/external/industrial_estates.csv
    weight: workers
    radii_m: [3000]

scoring:
  # คะแนน = ตลาดเป็นหลัก แล้วดูสิ่งรอบข้าง โดยแบ่งตัววัดเป็น 4 หมวด
  #   1) แต่ละตัววัด → เทียบกับตลาดอื่นเป็น percentile (0–1)
  #   2) ในหมวด: เฉลี่ยตัววัดตามน้ำหนักของมัน (measures) → คะแนนหมวด 0–100
  #   3) รวมหมวดตาม weight ของหมวด → คะแนนรวม 0–100
  # จัดเป็นหมวดเพื่อกันการนับเรื่องเดียวกันซ้ำ (เช่น ร้านสะดวกซื้อ 500 ม. + 1.5 กม. + 7-11)
  # เวลาเปิดไม่อยู่ในคะแนน — ใช้เป็นตัวกรองใน dashboard แทน
  # ปรับได้ทั้งที่นี่ หรือใน dashboard แล้วกด "ส่งออกไป config"
  rating_prior_reviews: 30   # ตลาดที่รีวิวน้อยกว่าราว ๆ นี้ เรตติ้งจะถูกดึงเข้าหาค่าเฉลี่ย
  profile_top_pct: 30        # ตลาดที่อยู่ top 30% ของหมวดไหน → ติดป้ายย่านนั้น (เช่น "ย่านที่พัก")
  pillars:
    market:
      label: ตลาดนี้มีคนมาจริงไหม
      weight: 2              # หลักฐานตรงที่สุด จึงหนักกว่าหมวดอื่น
      measures:
        reviews: 2
        rating: 1
    activity:
      label: ย่านนี้คึกคักไหม
      tag: ย่านคึกคัก
      weight: 1
      measures:
        conv_store_500: 2    # ถ้ามีไฟล์ 7-11 จะใช้ seven_500 แทนตัวนี้ก็ได้ (อย่าใส่ทั้งคู่ — นับซ้ำ)
        supermarket_1500: 1
        mall_1500: 1
        transit_500: 1
    residents:
      label: คนพักอาศัยแถวนี้เยอะไหม
      tag: ย่านที่พัก
      weight: 1
      measures:
        apartment_1500: 2
        lodging_1500: 1
        university_1500: 1
    workers:
      label: คนทำงานแถวนี้เยอะไหม
      tag: ย่านที่ทำงาน
      weight: 1
      measures:
        workplace_500: 1
        industrial_ha_1500: 1
        estate_workers_3000: 1

output:
  top_n_map: 50
